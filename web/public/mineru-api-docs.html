<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>解析引擎 API 调用文档 · 统一契约（本地 / 云端双引擎）</title>
  <!-- Docsify 渲染（组件已 vendor 至 /vendor/docsify，内网不依赖 CDN） -->
  <link rel="stylesheet" href="/vendor/docsify/vue.css" />
  <style>
    /* 主题色对齐项目 Element Plus 主色 */
    :root { --theme-color: #409EFF; }
  </style>
</head>
<body>
  <div id="app">文档加载中…</div>
  <script>
    // 读取与「自定义解析」页签（ParserCustomTab）共享的 Base URL 配置，
    // 注入 Markdown 内的 {{MINERU_BASE}} / {{SWAGGER_URL}} 占位符。
    (function () {
      var base = 'http://127.0.0.1:8010';
      try {
        var raw = localStorage.getItem('kge:mineru_config_v1');
        if (raw) {
          var cfg = JSON.parse(raw);
          if (cfg && cfg.baseUrl && String(cfg.baseUrl).trim()) base = String(cfg.baseUrl).trim();
        }
      } catch (e) { /* 忽略损坏缓存 */ }
      base = String(base).replace(/\/+$/, '');

      window.$docsify = {
        el: '#app',
        homepage: 'mineru-api-docs.md',
        loadSidebar: 'mineru-api-sidebar.md',
        subMaxLevel: 3,
        auto2top: true,
        search: {
          placeholder: '搜索文档',
          noData: '没有找到相关内容',
          depth: 3,
        },
        copyCode: {
          buttonText: '复制',
          successText: '已复制',
          errorText: '复制失败',
        },
        plugins: [
          function (hook) {
            hook.beforeEach(function (content) {
              return content
                .replace(/\{\{MINERU_BASE\}\}/g, base)
                .replace(/\{\{SWAGGER_URL\}\}/g, base + '/docs');
            });
          },
        ],
      };
    })();
  </script>
  <script src="/vendor/docsify/docsify.min.js"></script>
  <script src="/vendor/docsify/search.min.js"></script>
  <script src="/vendor/docsify/docsify-copy-code.min.js"></script>
</body>
</html>
