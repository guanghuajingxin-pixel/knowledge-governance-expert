[project]
name = "kb-common"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "elasticsearch[async]>=8.13,<9",  # 客户端主版本须与 ES 服务器 (8.15) 对齐；9.x 强制 compatible-with=9 头会被 8.x 拒绝
  "minio>=7.2",
  "redis>=5.0",
  "celery>=5.4",
  "FlagEmbedding>=1.2.7",
  "transformers>=4.41,<5",  # FlagEmbedding 1.4 FlagReranker 调用 tokenizer.prepare_for_model，5.x 已移除该 API
  "openai>=1.30",          # GLM/DeepSeek 兼容客户端
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt<4",  # passlib 1.7.4 incompatible with bcrypt>=4 (detect_wrap_bug); pin until passlib 1.8
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
