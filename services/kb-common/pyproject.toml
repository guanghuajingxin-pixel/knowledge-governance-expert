[project]
name = "kb-common"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "elasticsearch[async]>=8.13,<9",  # 客户端主版本须与 ES 服务器 (8.15) 对齐；9.x 强制 compatible-with=9 头会被 8.x 拒绝
  "minio>=7.2",
  "redis>=5.0",
  "celery>=5.4",
  # 向量/重排模型全部外接（OpenAI 兼容 /embeddings 与 /rerank HTTP API），不本地部署 BGE-M3/reranker
  "datrie>=0.8.3,<0.9",
  "hanziconv>=0.3.2,<0.4",
  "nltk>=3.10,<4",
  "numpy<2",  # numpy 2.x 要求 x86-64-v2；内网服务器 CPU 仅 x86-64-v1，固定 1.26
  "openai>=1.30",          # GLM/DeepSeek 兼容客户端
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt<4",  # passlib 1.7.4 incompatible with bcrypt>=4 (detect_wrap_bug); pin until passlib 1.8
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.package-data]
"kb_common.rag.ragflow_nlp" = ["LICENSE", "NOTICE", "sources.json", "res/*.json", "res/*.gz"]
