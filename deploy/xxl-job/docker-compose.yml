# XXL-Job 调度中心（admin + 专用 MySQL）。
# 开发环境：docker compose -f deploy/xxl-job/docker-compose.yml up -d
# 内网部署：服务定义已并入 deploy/intranet/docker-compose.infra.yml（挂 kge-network），
#           本文件用于开发机/独立环境单独起一套。
#
# 说明：
# - 表结构由 tables_xxl_job.sql 经 MySQL 初始化钩子自动导入（仅首次初始化数据卷时执行）。
# - admin 默认账号 admin/123456，首次上线后请在 XXL-Job 控制台修改密码。
# - accessToken 默认留空（如需开启，同时配置 admin 的 PARAMS 与 kb-api 的 XXL_JOB_ACCESS_TOKEN）。
# - 网络自包含：admin 只与自带 MySQL 互通；kb-api 执行器经发布端口访问 admin，
#   admin 经执行器注册上报的 IP:port 回调（容器内可路由到宿主机/同网段容器）。
name: kge-xxl-job

services:
  xxl-job-mysql:
    image: mysql:8.0
    container_name: kge-xxl-job-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${XXL_JOB_MYSQL_PASSWORD:-xxljob123}
      MYSQL_DATABASE: xxl_job
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${XXL_JOB_MYSQL_PORT:-3307}:3306"
    volumes:
      - xxl-job-mysql-data:/var/lib/mysql
      - ./tables_xxl_job.sql:/docker-entrypoint-initdb.d/tables_xxl_job.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${XXL_JOB_MYSQL_PASSWORD:-xxljob123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [xxl-network]

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: kge-xxl-job-admin
    restart: unless-stopped
    depends_on:
      xxl-job-mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://xxl-job-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${XXL_JOB_MYSQL_PASSWORD:-xxljob123}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-}
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "${XXL_JOB_ADMIN_PORT:-8080}:8080"
    # JVM 启动峰值内存较高，1g 限制曾触发 OOM Killed
    mem_limit: 1536m
    networks: [xxl-network]

volumes:
  xxl-job-mysql-data: {}

networks:
  xxl-network:
    name: kge-xxl-network
    driver: bridge
