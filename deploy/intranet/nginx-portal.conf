# External HTTPS ingress for the portal and its three applications.
# Replace every example hostname and install a certificate whose SAN covers all four names.
# This file belongs in the host Nginx http context (for example conf.d/portal.conf).

map $host $app_upstream {
    default                     "";
    portal.example.com          127.0.0.1:3200;
    kge.example.com             127.0.0.1:8080;
    evaluation.example.com      127.0.0.1:8082;
    skillhub.example.com        127.0.0.1:3100;
}

map $host $api_upstream {
    default                     "";
    portal.example.com          127.0.0.1:8080;
    kge.example.com             127.0.0.1:8080;
    evaluation.example.com      127.0.0.1:8082;
    skillhub.example.com        127.0.0.1:3100;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name portal.example.com kge.example.com evaluation.example.com skillhub.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    return 444;
}

server {
    listen 443 ssl http2;
    server_name portal.example.com kge.example.com evaluation.example.com skillhub.example.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    if ($app_upstream = "") { return 444; }

    # OAuth2 Proxy callback and sign-in endpoints are the only unauthenticated application routes.
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180/oauth2/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # APIs return 401 to callers; browser pages use the shared sign-in session.
    location ^~ /api/ {
        auth_request /oauth2/auth;
        error_page 401 = @api_unauthorized;
        auth_request_set $authenticated_user $upstream_http_x_auth_request_user;
        auth_request_set $authenticated_email $upstream_http_x_auth_request_email;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Authenticated-User $authenticated_user;
        proxy_set_header X-Authenticated-Email $authenticated_email;
        proxy_set_header X-Auth-Request-User $authenticated_user;
        proxy_set_header X-Auth-Request-Email $authenticated_email;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        auth_request_set $authenticated_user $upstream_http_x_auth_request_user;
        auth_request_set $authenticated_email $upstream_http_x_auth_request_email;
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Authenticated-User $authenticated_user;
        proxy_set_header X-Authenticated-Email $authenticated_email;
        proxy_set_header X-Auth-Request-User $authenticated_user;
        proxy_set_header X-Auth-Request-Email $authenticated_email;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location @oauth2_signin {
        return 302 https://portal.example.com/oauth2/start?rd=https://$host$request_uri;
    }

    location @api_unauthorized {
        return 401;
    }
}
