name: kge-app

services:
  kb-api:
    build:
      context: ../../
      dockerfile: services/kb-api/Dockerfile
    image: kge-kb-api:latest
    container_name: kge-kb-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
      # XXL-Job 执行器回调端口（admin 回调 XXL_JOB_EXECUTOR_IP:9998 → 容器）
      - "9998:9998"
    env_file: .env.app
    environment:
      # 统一东 8 区：naive timestamp 语义 = 北京时间（datetime.now()/func.now() 同基准）
      TZ: Asia/Shanghai
      # 认证模式开关在 .env.app 的 AUTH_PROVIDER（keycloak/local）；HTTPS 证书
      # 就位前保持 local，切换步骤见 deploy/keycloak/INTRANET-CUTOVER.md 第 3 节。
      MINERU_LOCAL_URL: ""
      # 文档库解析引擎：留空 → 走 MinerU 云 SaaS（Key 在「模型配置」页/settings 表），
      # 非空则指向本地 mineru-kit V1（http://host:8010）。生产未部署本地 kit，故留空。
      STRUCTURED_KIT_BASE_URL: ""
    volumes:
      - kb-api-data:/app/services/kb-api/data
    networks: [kge-network]

  deerflow:
    build:
      context: ../../
      dockerfile: services/deerflow/Dockerfile
    image: kge-deerflow:latest
    container_name: kge-deerflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:2027:2027"
    env_file: .env.app
    environment:
      # 统一东 8 区：naive timestamp 语义 = 北京时间（datetime.now()/func.now() 同基准）
      TZ: Asia/Shanghai
      KB_API_URL: http://kb-api:8000
    depends_on:
      - kb-api
    volumes:
      - deerflow-data:/app/services/deerflow/data
    networks: [kge-network]

  faq-service:
    build:
      context: ../../
      dockerfile: services/faq-service/Dockerfile
    image: kge-faq-service:latest
    container_name: kge-faq-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8004"
    env_file: .env.app
    environment:
      # 认证模式与 kb-api 同口径：开关在 .env.app 的 AUTH_PROVIDER，
      # keycloak 切换必须 kb-api + faq 同时生效（INTRANET-CUTOVER 第 3 节），
      # 不允许 compose 单方面强制任一侧。
      # 统一东 8 区：naive timestamp 语义 = 北京时间
      TZ: Asia/Shanghai
    networks: [kge-network]

  kb-worker:
    build:
      context: ../../
      dockerfile: services/kb-api/Dockerfile
    image: kge-kb-api:latest
    container_name: kge-kb-worker
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "app.worker", "worker", "-Q", "ingestion", "--concurrency=1", "-l", "info"]
    env_file: .env.app
    environment:
      TZ: Asia/Shanghai
      EMBED_VIA_INTERNAL: "true"
    networks: [kge-network]

volumes:
  kb-api-data: {}
  deerflow-data: {}

networks:
  kge-network:
    external: true
