# AIGC 门户默认端口站点（80）
#
# 部署口径（2026-10-14 起）：默认端口归门户，http://10.10.166.2/ 直接打开 AIGC 门户。
# 门户容器保持「源站收紧」：compose 只发布 127.0.0.1:3200，外部访问一律经本站点。
# 门户容器内层 nginx 自行把 /api/v1/ 反代到 PORTAL_API_TARGET（宿主 8080 → kb-api），
# 本站点只需全量转发到 127.0.0.1:3200，不做路径拆分。
#
# 安装（root）：
#   sudo cp /opt/kge/deploy/intranet/nginx-portal-80.conf /etc/nginx/sites-available/portal-80
#   sudo ln -sf /etc/nginx/sites-available/portal-80 /etc/nginx/sites-enabled/portal-80
#   sudo rm -f /etc/nginx/sites-enabled/kb-sync        # 旧知识同步后台站点（模块已下线）
#   sudo nginx -t && sudo nginx -s reload
#
# 演进：统一 HTTPS 入口（nginx-portal.conf + OAuth2 Proxy）上线后，本站点改为
# 443 反代或直接由统一入口接管，门户源站端口不变。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
